apiVersion: v1
kind: Service
metadata:
  name: {{ include "otlp-router.fullname" . }}
  labels:
    {{- include "otlp-router.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otlp-router.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: otlp-http
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
---
# Resolves to every ready replica, so the one serving the UI can add up the
# stats of all of them.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otlp-router.fullname" . }}-peers
  labels:
    {{- include "otlp-router.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "otlp-router.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: 8080
      targetPort: admin
