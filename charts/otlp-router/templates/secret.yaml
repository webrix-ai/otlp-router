{{- if not .Values.auth.existingSecret }}
{{- $name := include "otlp-router.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if $existing }}{{ $old = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "otlp-router.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.admin.password }}
  admin-password: {{ .Values.auth.admin.password | b64enc | quote }}
  {{- else }}
  admin-password: {{ get $old "admin-password" | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  session-secret: {{ get $old "session-secret" | default (randAlphaNum 48 | b64enc) | quote }}
  ingest-tokens: {{ join "," .Values.auth.ingestTokens | b64enc | quote }}
  willow-token: {{ .Values.willow.token | default "" | b64enc | quote }}
{{- end }}
