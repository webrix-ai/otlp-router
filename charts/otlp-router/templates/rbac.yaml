{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otlp-router.serviceAccountName" . }}
  labels:
    {{- include "otlp-router.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# Only the targets ConfigMap, and only read and update.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "otlp-router.fullname" . }}
  labels:
    {{- include "otlp-router.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "otlp-router.targetsConfigMap" . | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "otlp-router.fullname" . }}
  labels:
    {{- include "otlp-router.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "otlp-router.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otlp-router.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
